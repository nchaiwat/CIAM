services:
  postgres:
    image: postgres:16-alpine
    container_name: ciam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciam_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-central_iam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciam_admin} -d ${POSTGRES_DB:-central_iam}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
